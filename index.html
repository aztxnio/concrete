<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concrete mixes</title>
  <meta name="description" content="Types of concrete and the ingredients that go into each one.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Two links so one font failing to load doesn't take the other with it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
  <link rel="stylesheet" href="styles.css">

  <script>
    // Paper or table, dark or light paper and hidden lists, as this browser last
    // had them, set before anything is drawn so the page doesn't flash the
    // other way first.
    try {
      const view = JSON.parse(localStorage.getItem("concrete-view"));
      if (view?.mode === "table") document.documentElement.dataset.view = "table";
      if (view?.theme === "dark" || view?.theme === "light") document.documentElement.dataset.theme = view.theme;
      if (Array.isArray(view?.hide) && view.hide.length) document.documentElement.dataset.hide = view.hide.join(" ");
    } catch {
      // Storage is blocked, so it's the defaults.
    }
  </script>
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <h1 class="sr-only">Concrete mixes</h1>

  <div class="app">
    <aside class="panel panel--concretes" aria-labelledby="concretes-title">
      <div class="panel-head">
        <h2 class="panel-title" id="concretes-title">Concretes</h2>
        <button type="button" class="panel-toggle" id="concretes-toggle" aria-expanded="true" aria-label="Hide concretes" title="Hide concretes">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M11 4.5 6.5 9l4.5 4.5"/>
          </svg>
        </button>
      </div>
      <div class="panel-filter" id="concrete-filter">
        <label class="sr-only" for="concrete-search">Search concretes</label>
        <input class="draft-input panel-search" id="concrete-search" type="search" placeholder="Search concretes" autocomplete="off" spellcheck="false">
        <div class="filter-tags tag-row" role="group" aria-label="Filter concretes by tag"></div>
        <p class="filter-status" hidden><span role="status"></span> <button type="button" class="filter-clear">Clear</button></p>
      </div>
      <div class="panel-scroll">
        <div id="publish-draft"></div>
        <div id="concrete-draft"></div>
        <div id="concrete-page" hidden></div>
        <div class="lists" id="concrete-list"></div>
      </div>
    </aside>

    <main class="workspace" id="workspace" aria-label="Workspace">
      <div class="paper" id="paper" tabindex="-1">
        <div class="sheet" id="sheet">
          <div class="cards" id="cards"></div>
        </div>
      </div>

      <div class="table-view" id="table-view"></div>

      <div class="views" id="views" role="group" aria-label="Show">
        <button type="button" class="tool" id="show-paper" aria-pressed="true">Paper</button>
        <button type="button" class="tool" id="show-table" aria-pressed="false">Table</button>
      </div>

      <p class="empty-hint" id="empty-hint">
        <span class="hint-pointer">Drag a concrete or an ingredient onto the paper.</span>
        <span class="hint-touch">Tap + next to a concrete or an ingredient to put it on the paper.</span>
      </p>

      <p class="toast" id="toast" role="status" hidden></p>

      <div class="toolbar" id="toolbar" role="group" aria-label="Workspace tools">
        <button type="button" class="tool" id="add-concrete" aria-label="Add concrete" aria-controls="concrete-draft">
          <span class="tool-long">Add concrete</span><span class="tool-short">+ Concrete</span>
        </button>
        <button type="button" class="tool" id="add-ingredient" aria-label="Add ingredient" aria-controls="ingredient-draft">
          <span class="tool-long">Add ingredient</span><span class="tool-short">+ Ingredient</span>
        </button>
        <button type="button" class="tool" id="clear-canvas" aria-label="Clear canvas">
          <span class="tool-long">Clear canvas</span><span class="tool-short">Clear</span>
        </button>
        <button type="button" class="tool tool--icon" id="undo" aria-label="Undo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M6.5 3.5 3 7l3.5 3.5"/><path d="M3.5 7H11a4 4 0 0 1 0 8H7.5"/>
          </svg>
        </button>
        <button type="button" class="tool tool--icon" id="redo" aria-label="Redo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M11.5 3.5 15 7l-3.5 3.5"/><path d="M14.5 7H7a4 4 0 0 0 0 8h3.5"/>
          </svg>
        </button>
        <button type="button" class="tool tool--publish" id="publish" aria-controls="publish-draft" hidden>
          <span id="publish-label">Publish</span> <span class="tool-note" id="publish-count"></span>
        </button>
      </div>

      <div class="zoom" id="zoom" role="group" aria-label="View">
        <button type="button" class="tool tool--icon" id="theme" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <circle cx="9" cy="9" r="5.5"/><path d="M9 3.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button type="button" class="tool tool--icon" id="zoom-out" aria-label="Zoom out">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M4 9h10"/>
          </svg>
        </button>
        <button type="button" class="tool zoom-level" id="zoom-level" title="Back to 100%">100%</button>
        <button type="button" class="tool tool--icon" id="zoom-in" aria-label="Zoom in">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M9 4v10M4 9h10"/>
          </svg>
        </button>
      </div>
    </main>

    <aside class="panel panel--ingredients" aria-labelledby="ingredients-title">
      <div class="panel-head">
        <h2 class="panel-title" id="ingredients-title">Ingredients</h2>
        <button type="button" class="panel-toggle" id="ingredients-toggle" aria-expanded="true" aria-label="Hide ingredients" title="Hide ingredients">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true">
            <path d="M7 4.5 11.5 9 7 13.5"/>
          </svg>
        </button>
      </div>
      <div class="panel-filter" id="ingredient-filter">
        <label class="sr-only" for="ingredient-search">Search ingredients</label>
        <input class="draft-input panel-search" id="ingredient-search" type="search" placeholder="Search ingredients" autocomplete="off" spellcheck="false">
        <div class="filter-tags tag-row" role="group" aria-label="Filter ingredients by tag"></div>
        <p class="filter-status" hidden><span role="status"></span> <button type="button" class="filter-clear">Clear</button></p>
      </div>
      <div class="panel-scroll">
        <div id="ingredient-draft"></div>
        <div id="ingredient-page" hidden></div>
        <div class="lists" id="ingredient-list"></div>
      </div>
    </aside>
  </div>

  <p id="card-help" hidden>Drag to move it, or use the arrow keys. Delete removes it.</p>
</body>
</html>
